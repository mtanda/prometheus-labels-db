name: Go
on:
  release:
    types: [published]

# Least privilege: goreleaser needs to upload assets to the release.
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        # Pass the token as a build secret so it is not stored in image layers or build history.
        run: docker build --output=dist --target=final --secret id=github_token,env=GITHUB_TOKEN .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
